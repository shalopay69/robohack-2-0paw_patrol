bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: trunk
    odom_topic: /odom
    bt_loop_duration: 20
    default_server_timeout: 250
    wait_for_service_timeout: 3000
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_back_up_action_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_rate_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_round_robin_node_bt_node

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 12.0
    odom_topic: /odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 3.0
    progress_checker_plugin: progress_checker
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.08
      required_movement_angle: 0.16
      movement_time_allowance: 48.0
    goal_checker_plugins: [goal_checker, waypoint_checker]
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 3.15
      stateful: true
    waypoint_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.22
      yaw_goal_tolerance: 3.15
      stateful: true
    controller_plugins: [FollowPath, FollowNarrowPath]
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.24
      lookahead_dist: 0.38
      min_lookahead_dist: 0.27
      max_lookahead_dist: 0.60
      lookahead_time: 1.4
      use_velocity_scaled_lookahead_dist: false
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.65
      rotate_to_heading_angular_vel: 0.36
      max_angular_accel: 4.5
      transform_tolerance: 0.30
      allow_reversing: false
      min_approach_linear_velocity: 0.07
      approach_velocity_scaling_dist: 0.45
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.1
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.60
      regulated_linear_scaling_min_speed: 0.10
      cost_scaling_dist: 0.43
      cost_scaling_gain: 0.85
      inflation_cost_scaling_factor: 6.0
    FollowNarrowPath:
      plugin: dwb_core::DWBLocalPlanner
      min_vel_x: -0.08
      max_vel_x: 0.20
      min_vel_y: -0.16
      max_vel_y: 0.16
      max_vel_theta: 0.48
      min_speed_xy: 0.0
      max_speed_xy: 0.22
      min_speed_theta: 0.0
      acc_lim_x: 0.65
      decel_lim_x: -0.65
      acc_lim_y: 0.55
      decel_lim_y: -0.55
      acc_lim_theta: 1.15
      decel_lim_theta: -1.15
      vx_samples: 9
      vy_samples: 9
      vtheta_samples: 13
      sim_time: 2.6
      linear_granularity: 0.04
      angular_granularity: 0.08
      transform_tolerance: 0.30
      xy_goal_tolerance: 0.17
      trans_stopped_velocity: 0.08
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [RotateToGoal, Oscillation, ObstacleFootprint, PathAlign, PathDist, GoalDist]
      RotateToGoal.scale: 32.0
      ObstacleFootprint.scale: 0.035
      PathAlign.scale: 23.0
      PathAlign.forward_point_distance: 0.38
      PathDist.scale: 32.0
      GoalDist.scale: 24.0

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased, NavFn]
    GridBased:
      plugin: nav2_theta_star_planner/ThetaStarPlanner
      how_many_corners: 8
      w_traversal_cost: 6.0
      allow_unknown: true
    NavFn:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.10
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    global_frame: odom
    local_frame: odom
    robot_base_frame: trunk
    transform_tolerance: 0.30
    cycle_frequency: 8.0
    max_rotational_vel: 0.36
    min_rotational_vel: 0.16
    rotational_acc_lim: 0.5
    behavior_plugins: [wait, drive_on_heading, backup, spin]
    spin:
      plugin: nav2_behaviors/Spin
    wait:
      plugin: nav2_behaviors/Wait
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    backup:
      plugin: nav2_behaviors/BackUp

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    bond_timeout: 12.0
    node_names: [controller_server, planner_server, behavior_server, bt_navigator]

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: trunk
      resolution: 0.06
      update_frequency: 3.0
      publish_frequency: 1.0
      track_unknown_space: true
      robot_radius: 0.22
      transform_tolerance: 0.30
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.72
        cost_scaling_factor: 3.1

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: trunk
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      update_frequency: 10.0
      publish_frequency: 3.0
      transform_tolerance: 0.30
      footprint: '[[0.31,0.10],[0.23,0.185],[-0.22,0.185],[-0.31,0.10],[-0.31,-0.10],[-0.22,-0.185],[0.23,-0.185],[0.31,-0.10]]'
      footprint_padding: 0.015
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: lidar
        lidar:
          topic: /scan_filtered
          data_type: LaserScan
          min_obstacle_height: -0.18
          max_obstacle_height: 0.85
          obstacle_max_range: 4.5
          raytrace_max_range: 5.0
          obstacle_min_range: 0.16
          raytrace_min_range: 0.13
          marking: true
          clearing: true
          inf_is_valid: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.46
        cost_scaling_factor: 6.0
